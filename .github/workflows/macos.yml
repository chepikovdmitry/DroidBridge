name: macOS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build on Apple Silicon
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          brew install libmtp pkgconf
          pkg-config --modversion libmtp

      - name: Run Swift tests
        run: swift test

      - name: Build and verify the app bundle
        run: |
          ./Scripts/build-app.sh -c release
          app=.build/DroidBridge.app
          codesign --verify --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/DroidBridge")" = arm64
          source Scripts/version.env
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$DROIDBRIDGE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$DROIDBRIDGE_BUILD_NUMBER"
          resources="$app/Contents/Resources/DroidBridge_DroidBridgeCore.bundle"
          for language in en ru es fr de pt-br ja zh-hans; do
            plutil -lint "$resources/$language.lproj/Localizable.strings"
          done
